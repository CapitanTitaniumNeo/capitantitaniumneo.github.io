<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C and T Titanium | Официален портал</title>
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #131b2e;
      --border-color: #1f2d4a;
      --accent: #00e5ff;
      --accent-glow: rgba(0, 229, 255, 0.35);
      --accent-hover: #00b8d4;
      --titanium-mid: #94a3b8;
      --text-primary: #f0f4f8;
      --text-secondary: #8b9bb4;
      --success: #00e676;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      padding: 36px 26px;
      text-align: center;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.6);
    }

    /* Кръгло цифрово лого C & T Titanium */
    .logo-circle {
      width: 112px;
      height: 112px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 35%, #1a2744 0%, #090d16 100%);
      border: 2px solid var(--accent);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      box-shadow: 
        0 0 24px var(--accent-glow),
        inset 0 0 18px rgba(0, 229, 255, 0.2);
    }

    .logo-circle::before {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      border: 1px dashed rgba(0, 229, 255, 0.45);
      pointer-events: none;
    }

    .logo-circle svg {
      width: 88px;
      height: 88px;
    }

    .dev-brand {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      background: linear-gradient(90deg, #ffffff 0%, var(--accent) 55%, var(--titanium-mid) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .portal-subtitle {
      font-size: 0.82rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1.4px;
      margin-bottom: 16px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 230, 118, 0.1);
      color: var(--success);
      border: 1px solid rgba(0, 230, 118, 0.25);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      margin-bottom: 18px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
    }

    p.description {
      color: var(--text-secondary);
      font-size: 0.94rem;
      margin-bottom: 24px;
    }

    .contact-form {
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .contact-form label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      display: block;
      margin-bottom: 4px;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.15);
    }

    .contact-form textarea {
      resize: vertical;
      min-height: 110px;
    }

    .btn-submit {
      background-color: var(--accent);
      color: #050811;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      margin-top: 6px;
      box-shadow: 0 4px 14px rgba(0, 229, 255, 0.25);
    }

    .btn-submit:hover {
      background-color: var(--accent-hover);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-msg {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.88rem;
      text-align: center;
    }

    .status-msg.success {
      display: block;
      background: rgba(0, 230, 118, 0.12);
      color: var(--success);
      border: 1px solid rgba(0, 230, 118, 0.3);
    }

    .status-msg.error {
      display: block;
      background: rgba(255, 82, 82, 0.12);
      color: #ff5252;
      border: 1px solid rgba(255, 82, 82, 0.3);
    }

    .divider {
      margin: 22px 0;
      border: none;
      border-top: 1px solid var(--border-color);
    }

    .github-link {
      display: inline-block;
      color: var(--text-secondary);
      font-size: 0.85rem;
      text-decoration: none;
      transition: color 0.2s;
    }

    .github-link:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Кръгло дигитално лого C & T Titanium -->
    <div class="logo-circle">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00e5ff" />
            <stop offset="100%" stop-color="#cbd5e1" />
          </linearGradient>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <path d="M 28 24 A 34 34 0 0 1 72 24" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
        <circle cx="35" cy="28" r="2.2" fill="#00e5ff" filter="url(#glow)" />
        <circle cx="65" cy="28" r="2.2" fill="#00e5ff" filter="url(#glow)" />

        <text x="50" y="57" text-anchor="middle" fill="url(#cyberGlow)" filter="url(#glow)" font-family="Segoe UI, Roboto, monospace" font-weight="800" font-size="25" letter-spacing="1">
          C&amp;T
        </text>

        <text x="50" y="73" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Roboto, sans-serif" font-weight="700" font-size="8.5" letter-spacing="2.5">
          TITANIUM
        </text>
      </svg>
    </div>

    <div class="dev-brand">C and T Titanium</div>
    <div class="portal-subtitle">Официален портал за поддръжка</div>

    <div class="status-badge">
      <span class="status-dot"></span>
      Сигурна връзка със системата
    </div>

    <p class="description">
      Единна страница за поддръжка и обратна връзка към нашите мобилни и уеб приложения.
    </p>

    <form class="contact-form" id="contactForm">
      <div>
        <label for="sender">Имейл за обратна връзка (по желание)</label>
        <input type="email" id="sender" name="email" placeholder="example@mail.com">
      </div>

      <div>
        <label for="message">Съобщение</label>
        <textarea id="message" name="message" placeholder="Напишете вашето запитване или сигнал тук..." required></textarea>
      </div>

      <input type="hidden" name="_subject" value="Ново съобщение от портала C and T Titanium">
      <input type="hidden" name="_captcha" value="false">

      <button type="submit" class="btn-submit" id="submitBtn">Изпрати съобщение (ОК)</button>
      <div id="statusMessage" class="status-msg"></div>
    </form>

    <hr class="divider">

    <a class="github-link" href="https://github.com/cntitaniumneo/cntitaniumneo.github.io/issues" target="_blank" rel="noopener">
      Или отвори секцията за съобщения в GitHub (C and T Titanium) ➔
    </a>
  </div>

  <script>
    const form = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');

    // Кодиран адрес за защита от спам ботове и скриване от публичния код
    const _target = [105,98,97,110,101,118,64,103,109,97,105,108,46,99,111,109].map(c => String.fromCharCode(c)).join('');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Изпращане...';
      statusMessage.className = 'status-msg';

      const formData = new FormData(form);

      try {
        const response = await fetch('https://formsubmit.co/ajax/' + _target, {
          method: 'POST',
          headers: { 'Accept': 'application/json' },
          body: formData
        });

        const result = await response.json();

        if (response.ok) {
          statusMessage.textContent = 'Съобщението е изпратено успешно! Благодарим ви за обратната връзка.';
          statusMessage.className = 'status-msg success';
          form.reset();
        } else {
          statusMessage.textContent = 'Моля, проверете пощата за първоначално активиране на формата или използвайте GitHub бутона отдолу.';
          statusMessage.className = 'status-msg error';
        }
      } catch (err) {
        statusMessage.textContent = 'Възникна грешка при връзката. Моля, опитайте отново.';
        statusMessage.className = 'status-msg error';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Изпрати съобщение (ОК)';
      }
    });
  </script>

</body>
</html>
