<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f19">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Captain Titanium - Official Support Portal (Captain Titanium Neo)">
  <title>Captain Titanium | Official Support Portal</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%230b0f19' stroke='%2300e5ff' stroke-width='6'/%3E%3Ctext x='50' y='62' text-anchor='middle' fill='%2300e5ff' font-family='sans-serif' font-weight='900' font-size='38'%3ECT%3C/text%3E%3C/svg%3E">

  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: rgba(19, 27, 46, 0.94);
      --border-color: #1f2d4a;
      --accent: #00e5ff;
      --accent-glow: rgba(0, 229, 255, 0.32);
      --accent-hover: #00b8d4;
      --titanium-mid: #94a3b8;
      --text-primary: #f0f4f8;
      --text-secondary: #8b9bb4;
      --success: #00e676;
      --danger: #ff5252;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      width: 100dvw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 229, 255, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 50% 100%, rgba(19, 27, 46, 0.9) 0%, transparent 70%);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    }

    .container {
      background-color: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      width: 100%;
      max-width: 460px;
      max-height: 100%;
      padding: clamp(12px, 2.2vh, 26px) clamp(14px, 4vw, 26px);
      text-align: center;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.65), 0 0 1px rgba(0, 229, 255, 0.2);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: clamp(6px, 1.2vh, 14px);
    }

    .lang-bar {
      position: absolute;
      top: clamp(10px, 1.8vh, 16px);
      inset-inline-end: clamp(10px, 2.5vw, 16px);
      z-index: 10;
    }

    .lang-select {
      background-color: rgba(11, 15, 25, 0.92);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 4px 7px;
      font-size: 0.74rem;
      font-weight: 600;
      max-width: 128px;
      outline: none;
      cursor: pointer;
    }

    .lang-select:hover,
    .lang-select:focus {
      border-color: var(--accent);
    }

    .brand-pane {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .logo-circle {
      width: clamp(68px, 11vh, 98px);
      height: clamp(68px, 11vh, 98px);
      margin: 0 auto clamp(6px, 1vh, 12px);
      border-radius: 50%;
      background: radial-gradient(circle at 50% 35%, #1a2744 0%, #090d16 100%);
      border: 2px solid var(--accent);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      box-shadow: 0 0 22px var(--accent-glow), inset 0 0 16px rgba(0, 229, 255, 0.22);
      flex-shrink: 0;
    }

    .logo-circle::before {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      border: 1px dashed rgba(0, 229, 255, 0.45);
      pointer-events: none;
    }

    .logo-circle svg {
      width: 82%;
      height: 82%;
    }

    .dev-brand {
      font-size: clamp(1.2rem, 2.6vh, 1.55rem);
      font-weight: 800;
      letter-spacing: 0.6px;
      background: linear-gradient(90deg, #ffffff 0%, var(--accent) 55%, var(--titanium-mid) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    .portal-subtitle {
      font-size: clamp(0.66rem, 1.3vh, 0.76rem);
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1.4px;
      margin-top: 2px;
      margin-bottom: clamp(6px, 1vh, 10px);
      font-weight: 600;
    }

    .airport-badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.09) 0%, rgba(11, 15, 25, 0.85) 100%);
      border: 1px solid rgba(0, 229, 255, 0.3);
      border-radius: 12px;
      padding: clamp(4px, 0.8vh, 7px) 12px;
      margin-bottom: clamp(6px, 1vh, 10px);
      max-width: 100%;
    }

    .plane-icon-box {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 30%, #1e2d4f 0%, #0b0f19 100%);
      border: 1.5px solid var(--accent);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      flex-shrink: 0;
    }

    .plane-icon-box svg {
      width: 17px;
      height: 17px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .airport-flag {
      position: absolute;
      bottom: -3px;
      right: -4px;
      font-size: 0.76rem;
      line-height: 1;
    }

    .airport-info {
      text-align: start;
      line-height: 1.2;
      overflow: hidden;
    }

    .airport-status {
      font-size: 0.63rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      display: block;
    }

    .airport-name {
      font-size: clamp(0.74rem, 1.4vh, 0.82rem);
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
      display: block;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 230, 118, 0.09);
      color: var(--success);
      border: 1px solid rgba(0, 230, 118, 0.25);
      padding: 3px 11px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 500;
      margin-bottom: clamp(4px, 0.8vh, 8px);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background-color: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
      flex-shrink: 0;
    }

    p.description {
      color: var(--text-secondary);
      font-size: clamp(0.76rem, 1.45vh, 0.88rem);
      line-height: 1.35;
    }

    .form-pane {
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
    }

    .contact-form {
      text-align: start;
      display: flex;
      flex-direction: column;
      gap: clamp(6px, 1.1vh, 11px);
    }

    .contact-form label {
      font-size: clamp(0.74rem, 1.35vh, 0.8rem);
      color: var(--text-secondary);
      display: block;
      margin-bottom: 2px;
      font-weight: 500;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: clamp(7px, 1.1vh, 10px) 12px;
      color: var(--text-primary);
      font-size: 16px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .contact-form input:-webkit-autofill,
    .contact-form textarea:-webkit-autofill {
      -webkit-text-fill-color: var(--text-primary);
      -webkit-box-shadow: 0 0 0px 1000px var(--bg-main) inset;
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
      border-color: var(--accent);
    }

    .contact-form textarea {
      resize: none;
      height: clamp(52px, 8.5vh, 84px);
    }

    .captcha-box {
      background: rgba(9, 13, 22, 0.9);
      border: 1px solid var(--border-color);
      border-radius: 11px;
      padding: clamp(6px, 1vh, 10px);
      display: flex;
      flex-direction: column;
      gap: clamp(5px, 0.8vh, 8px);
    }

    .captcha-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      color: var(--accent);
      font-weight: 600;
    }

    .captcha-canvas-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    #captchaCanvas {
      flex: 1;
      height: clamp(38px, 5.8vh, 50px);
      width: 100%;
      background: #060911;
      border: 1px solid rgba(0, 229, 255, 0.35);
      border-radius: 8px;
      display: block;
      user-select: none;
    }

    .btn-refresh-captcha {
      width: 40px;
      height: clamp(38px, 5.8vh, 50px);
      background-color: #0e1628;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--accent);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .btn-refresh-captcha svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .captcha-input-wrap {
      position: relative;
    }

    #captchaInput {
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: 800;
      text-align: center;
      font-family: "Courier New", Consolas, monospace;
      padding: clamp(6px, 0.9vh, 9px) 32px;
    }

    #captchaInput.valid {
      border-color: var(--success);
      color: var(--success);
    }

    #captchaInput.invalid {
      border-color: var(--danger);
    }

    .captcha-status-icon {
      position: absolute;
      inset-inline-end: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.9rem;
      pointer-events: none;
    }

    .btn-submit {
      background: linear-gradient(180deg, #18ffff 0%, var(--accent) 100%);
      color: #050811;
      border: none;
      border-radius: 10px;
      padding: clamp(9px, 1.4vh, 13px);
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 229, 255, 0.25);
    }

    .btn-submit:disabled {
      opacity: 0.42;
      cursor: not-allowed;
      box-shadow: none;
    }

    .status-msg {
      display: none;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.76rem;
      text-align: center;
    }

    .status-msg.success {
      display: block;
      background: rgba(0, 230, 118, 0.12);
      color: var(--success);
      border: 1px solid rgba(0, 230, 118, 0.3);
    }

    .status-msg.error {
      display: block;
      background: rgba(255, 82, 82, 0.12);
      color: #ff6b6b;
      border: 1px solid rgba(255, 82, 82, 0.3);
    }

    .footer-bar {
      border-top: 1px solid var(--border-color);
      padding-top: clamp(6px, 1vh, 10px);
      margin-top: 4px;
      color: var(--text-secondary);
      font-size: 0.74rem;
      letter-spacing: 0.4px;
    }

    @media (orientation: landscape) and (max-height: 640px), (min-width: 760px) and (max-height: 760px) {
      .container {
        max-width: 860px;
        flex-direction: row;
        align-items: center;
        gap: clamp(16px, 3vw, 28px);
        padding: clamp(12px, 2.5vh, 22px) clamp(18px, 3vw, 28px);
      }

      .brand-pane {
        flex: 0 0 42%;
        max-width: 42%;
        border-inline-end: 1px solid var(--border-color);
        padding-inline-end: clamp(12px, 2vw, 22px);
      }

      .form-pane {
        flex: 1;
      }

      .logo-circle {
        width: clamp(58px, 14vh, 84px);
        height: clamp(58px, 14vh, 84px);
      }

      .contact-form textarea {
        height: clamp(42px, 10vh, 64px);
      }
    }
  </style>
</head>
<body>

  <main class="container">
    <div class="lang-bar">
      <select id="langSelect" class="lang-select" aria-label="Language"></select>
    </div>

    <!-- Лява/Горна секция: Лого Captain Titanium + Летище -->
    <section class="brand-pane">
      <div class="logo-circle" aria-hidden="true">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00e5ff" />
              <stop offset="100%" stop-color="#cbd5e1" />
            </linearGradient>
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="2" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
          </defs>

          <path d="M 26 24 A 34 34 0 0 1 74 24" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
          <circle cx="34" cy="28" r="2.3" fill="#00e5ff" filter="url(#glow)" />
          <circle cx="66" cy="28" r="2.3" fill="#00e5ff" filter="url(#glow)" />

          <text x="50" y="56" text-anchor="middle" fill="url(#cyberGlow)" filter="url(#glow)" font-family="Segoe UI, Roboto, monospace" font-weight="900" font-size="27" letter-spacing="1.5">
            CT
          </text>

          <text x="50" y="69" text-anchor="middle" fill="#00e5ff" font-family="Segoe UI, Roboto, sans-serif" font-weight="800" font-size="6.8" letter-spacing="2.2">
            CAPTAIN
          </text>

          <text x="50" y="79" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Roboto, sans-serif" font-weight="700" font-size="6.8" letter-spacing="2">
            TITANIUM
          </text>
        </svg>
      </div>

      <h1 class="dev-brand">Captain Titanium</h1>
      <div class="portal-subtitle" id="t-subtitle">Captain Titanium Neo Portal</div>

      <div class="airport-badge" id="airportBadge">
        <div class="plane-icon-box" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M2 20h20" />
            <path d="M3.5 11.5L10 14l4.5-6.5 2.5.8-2 6.7 4.5 1.2c.8.2 1.5-.3 1.5-1.1v-1.6l-3-1" />
          </svg>
          <span class="airport-flag" id="t-flag"></span>
        </div>
        <div class="airport-info">
          <span class="airport-status" id="t-landing-label">Landing Terminal</span>
          <span class="airport-name" id="t-airport-name">Hartsfield-Jackson Atlanta (ATL)</span>
        </div>
      </div>

      <div>
        <div class="status-badge">
          <span class="status-dot"></span>
          <span id="t-badge">Secure System Connection</span>
        </div>
      </div>

      <p class="description" id="t-desc">
        Unified support and feedback portal for our mobile and web applications.
      </p>
    </section>

    <!-- Дясна/Долна секция: Форма и Плаващ анти-бот код -->
    <section class="form-pane">
      <form class="contact-form" id="contactForm" novalidate>
        <input type="text" name="_honey" id="honeyField" style="display:none" tabindex="-1" autocomplete="off">
        <input type="hidden" name="_subject" value="New message from Captain Titanium Neo Portal">
        <input type="hidden" name="_captcha" value="false">

        <div>
          <label for="sender" id="t-email-label">Email for reply (optional)</label>
          <input type="email" id="sender" name="email" placeholder="example@mail.com" autocomplete="email">
        </div>

        <div>
          <label for="message" id="t-msg-label">Message</label>
          <textarea id="message" name="message" placeholder="Write your inquiry or message here..." required></textarea>
        </div>

        <div class="captcha-box">
          <div class="captcha-header">
            <span id="t-captcha-title">Anti-Bot Floating Code</span>
            <span id="captchaTimer">60s</span>
          </div>

          <div class="captcha-canvas-row">
            <canvas id="captchaCanvas" width="260" height="48" aria-label="Floating security code"></canvas>
            <button type="button" class="btn-refresh-captcha" id="refreshCaptchaBtn" title="New Code" aria-label="Generate new security code">
              <svg viewBox="0 0 24 24">
                <path d="M23 4v6h-6" />
                <path d="M1 20v-6h6" />
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
              </svg>
            </button>
          </div>

          <div class="captcha-input-wrap">
            <input type="text" id="captchaInput" maxlength="6" placeholder="ENTER 6-CHAR CODE" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" required>
            <span class="captcha-status-icon" id="captchaStatusIcon"></span>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn" disabled>Send Message (OK)</button>
        <div id="statusMessage" class="status-msg" role="status" aria-live="polite"></div>
      </form>

      <div class="footer-bar" id="t-footer">
        &copy; Captain Titanium | Captain Titanium Neo
      </div>
    </section>
  </main>

  <script>
    function getFlagEmoji(cc) {
      if (!cc || cc.length !== 2) return "\uD83C\uDF10";
      return String.fromCodePoint(
        ...cc.toUpperCase().split('').map(c => 127397 + c.charCodeAt(0))
      );
    }

    initLanguage();

    // ============================================================================
    // ТЕЖЪК ПЛАВАЩ АНТИ-БОТ КОД (60 FPS SINE-WAVE DISTORTION + ANTI-OCR MESH)
    // ============================================================================
    const canvas = document.getElementById('captchaCanvas');
    const ctx = canvas.getContext('2d');
    const captchaInput = document.getElementById('captchaInput');
    const refreshCaptchaBtn = document.getElementById('refreshCaptchaBtn');
    const captchaStatusIcon = document.getElementById('captchaStatusIcon');
    const captchaTimerEl = document.getElementById('captchaTimer');
    const submitBtn = document.getElementById('submitBtn');

    const CHARSET = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
    let activeCode = "";
    let charProps = [];
    let noiseDots = [];
    let timeLeft = 60;
    let failedAttempts = 0;
    let lockedUntil = 0;
    let humanInteracted = false;

    window.addEventListener('pointermove', () => { humanInteracted = true; }, { once: true });
    window.addEventListener('touchstart', () => { humanInteracted = true; }, { once: true });
    window.addEventListener('keydown', () => { humanInteracted = true; }, { once: true });

    function generateChallenge() {
      if (Date.now() < lockedUntil) return;
      activeCode = "";
      charProps = [];
      const colors = ["#00e5ff", "#76ff03", "#ffd740", "#ff80ab", "#82b1ff", "#e0f7fa"];

      for (let i = 0; i < 6; i++) {
        const ch = CHARSET.charAt(Math.floor(Math.random() * CHARSET.length));
        activeCode += ch;
        charProps.push({
          char: ch,
          phase: Math.random() * Math.PI * 2,
          speed: 0.045 + Math.random() * 0.03,
          ampY: 4.5 + Math.random() * 3,
          ampRot: 0.18 + Math.random() * 0.14,
          color: colors[i % colors.length]
        });
      }

      noiseDots = [];
      for (let i = 0; i < 35; i++) {
        noiseDots.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 1.4,
          vy: (Math.random() - 0.5) * 1.4,
          r: 1 + Math.random() * 1.4
        });
      }

      timeLeft = 60;
      captchaInput.value = "";
      captchaInput.classList.remove('valid', 'invalid');
      captchaStatusIcon.textContent = "";
      submitBtn.disabled = true;
    }

    let animTick = 0;
    function renderFloatingCaptcha() {
      animTick += 1;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#060911";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "rgba(0, 229, 255, 0.11)";
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 18) {
        ctx.beginPath();
        ctx.moveTo(x + Math.sin(animTick * 0.03 + x) * 4, 0);
        ctx.lineTo(x - Math.sin(animTick * 0.03 + x) * 4, canvas.height);
        ctx.stroke();
      }

      const startX = 28;
      const stepX = 39;

      for (let i = 0; i < charProps.length; i++) {
        const p = charProps[i];
        const wave = animTick * p.speed + p.phase;
        const dx = startX + i * stepX + Math.cos(wave * 0.9) * 3;
        const dy = canvas.height / 2 + 7 + Math.sin(wave) * p.ampY;
        const rot = Math.sin(wave * 0.8) * p.ampRot;

        ctx.save();
        ctx.translate(dx, dy);
        ctx.rotate(rot);
        ctx.transform(1, Math.sin(wave) * 0.12, Math.cos(wave) * 0.12, 1, 0, 0);

        ctx.font = "900 23px 'Courier New', Consolas, monospace";
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 7;
        ctx.fillStyle = p.color;
        ctx.fillText(p.char, -8, 0);

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 0.5;
        ctx.strokeText(p.char, -7, -1);
        ctx.restore();
      }

      for (let w = 0; w < 2; w++) {
        ctx.beginPath();
        ctx.strokeStyle = w === 0 ? "rgba(0, 229, 255, 0.48)" : "rgba(0, 230, 118, 0.38)";
        ctx.lineWidth = 1.5;
        for (let x = 0; x <= canvas.width; x += 10) {
          const y = canvas.height / 2 + Math.sin(x * 0.045 + animTick * 0.07 + w * 2) * 13;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      ctx.fillStyle = "rgba(226, 232, 240, 0.45)";
      for (const dot of noiseDots) {
        dot.x += dot.vx;
        dot.y += dot.vy;
        if (dot.x < 0) dot.x = canvas.width;
        if (dot.x > canvas.width) dot.x = 0;
        if (dot.y < 0) dot.y = canvas.height;
        if (dot.y > canvas.height) dot.y = 0;
        ctx.beginPath();
        ctx.arc(dot.x, dot.y, dot.r, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(renderFloatingCaptcha);
    }

    setInterval(() => {
      if (Date.now() < lockedUntil) {
        const waitSec = Math.ceil((lockedUntil - Date.now()) / 1000);
        captchaTimerEl.textContent = `${waitSec}s`;
        return;
      }
      timeLeft -= 1;
      if (timeLeft <= 0) {
        generateChallenge();
      }
      captchaTimerEl.textContent = `${timeLeft}s`;
    }, 1000);

    refreshCaptchaBtn.addEventListener('click', generateChallenge);

    captchaInput.addEventListener('input', function() {
      if (Date.now() < lockedUntil) {
        this.value = "";
        return;
      }
      const val = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      this.value = val;

      if (val.length === 6) {
        if (val === activeCode) {
          this.classList.add('valid');
          this.classList.remove('invalid');
          captchaStatusIcon.textContent = "\u2714";
          submitBtn.disabled = false;
        } else {
          this.classList.add('invalid');
          this.classList.remove('valid');
          captchaStatusIcon.textContent = "\u2716";
          submitBtn.disabled = true;
          failedAttempts += 1;

          if (failedAttempts >= 3) {
            lockedUntil = Date.now() + 30000;
            failedAttempts = 0;
            statusMessage.textContent = currentStrings.errorLocked;
            statusMessage.className = 'status-msg error';
            setTimeout(() => {
              statusMessage.className = 'status-msg';
              generateChallenge();
            }, 30000);
          }
        }
      } else {
        this.classList.remove('valid', 'invalid');
        captchaStatusIcon.textContent = "";
        submitBtn.disabled = true;
      }
    });

    generateChallenge();
    requestAnimationFrame(renderFloatingCaptcha);

    function computeProofOfWork(seed) {
      let nonce = 0;
      while (nonce < 250000) {
        let hash = 2166136261;
        const str = seed + ":" + nonce;
        for (let i = 0; i < str.length; i++) {
          hash ^= str.charCodeAt(i);
          hash = Math.imul(hash, 16777619);
        }
        if ((hash & 0xfff) === 0x777) return nonce;
        nonce++;
      }
      return nonce;
    }

    const form = document.getElementById('contactForm');
    const statusMessage = document.getElementById('statusMessage');
    const _target = [105,98,97,110,101,118,64,103,109,97,105,108,46,99,111,109].map(c => String.fromCharCode(c)).join('');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const honey = document.getElementById('honeyField').value;
      const enteredCode = captchaInput.value.trim().toUpperCase();

      if (honey || !humanInteracted || Date.now() < lockedUntil || enteredCode !== activeCode) {
        statusMessage.textContent = currentStrings.errorCaptcha;
        statusMessage.className = 'status-msg error';
        generateChallenge();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = currentStrings.sending;
      statusMessage.className = 'status-msg';

      const powNonce = computeProofOfWork(activeCode);
      const formData = new FormData(form);
      formData.append('_security_pow', powNonce);

      try {
        const response = await fetch('https://formsubmit.co/ajax/' + _target, {
          method: 'POST',
          headers: { 'Accept': 'application/json' },
          body: formData
        });

        if (response.ok) {
          statusMessage.textContent = currentStrings.success;
          statusMessage.className = 'status-msg success';
          form.reset();
          generateChallenge();
        } else {
          statusMessage.textContent = currentStrings.errorActivate;
          statusMessage.className = 'status-msg error';
          generateChallenge();
        }
      } catch (err) {
        statusMessage.textContent = currentStrings.errorNet;
        statusMessage.className = 'status-msg error';
        generateChallenge();
      } finally {
        submitBtn.textContent = currentStrings.btn;
      }
    });
  </script>

</body>
</html>
